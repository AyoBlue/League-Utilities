name: Deploy Discord bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          SSH_HOST: ${{ secrets.DO_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='__pycache__' \
            -czf /tmp/league-utilities.tar.gz .

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.DO_HOST }}
          SSH_USER: ${{ secrets.DO_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" \
            /tmp/league-utilities.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/league-utilities.tar.gz"

      - name: Install and restart bot
        env:
          SSH_HOST: ${{ secrets.DO_HOST }}
          SSH_USER: ${{ secrets.DO_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          DEPLOY_DIR="$HOME/League-Utilities"
          PROCESS_NAME="league-utilities-bot"

          mkdir -p "$DEPLOY_DIR"
          tar -xzf /tmp/league-utilities.tar.gz -C "$DEPLOY_DIR"
          rm /tmp/league-utilities.tar.gz

          python3 -m venv "$DEPLOY_DIR/.venv"
          "$DEPLOY_DIR/.venv/bin/python" -m pip install --upgrade pip
          "$DEPLOY_DIR/.venv/bin/python" -m pip install discord.py python-dotenv asyncpg

          if pm2 describe "$PROCESS_NAME" >/dev/null 2>&1; then
            pm2 restart "$PROCESS_NAME" --update-env
          else
            pm2 start "$DEPLOY_DIR/bot.py" \
              --name "$PROCESS_NAME" \
              --cwd "$DEPLOY_DIR" \
              --interpreter "$DEPLOY_DIR/.venv/bin/python"
          fi

          pm2 save
          pm2 show "$PROCESS_NAME"
          REMOTE
